name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  scanner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: tests/run.sh
      - name: Codex agents are in sync with agents/*.md
        run: python3 tools/gen-codex-agents.py && git diff --exit-code codex/
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          path: tests/fixtures/legacy-app
          fail-on: none
